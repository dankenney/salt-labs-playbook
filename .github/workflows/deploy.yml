# Build and deploy the playbook to GitHub Pages (https://playbook.besaltlabs.ai) on every push to main.
# Can also be run by hand from the Actions tab (workflow_dispatch).
# Optional repo variables (Settings → Secrets and variables → Actions → Variables); all unset by default:
#   SITE_URL             canonical URL (build default: https://playbook.besaltlabs.ai)
#   PAGES_CUSTOM_DOMAIN  overrides public/CNAME (which already contains playbook.besaltlabs.ai)
#   PLAYBOOK_INDEXABLE   'true' to allow search indexing (default: noindex + robots.txt Disallow)
name: Deploy playbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write CNAME (optional)
        if: ${{ vars.PAGES_CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.PAGES_CUSTOM_DOMAIN }}" > public/CNAME
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PLAYBOOK_INDEXABLE: ${{ vars.PLAYBOOK_INDEXABLE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
